[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-map"
version = "0.1.0"
description = "A team of agents that turns coding-agent sessions into ground-truthed, durable, cross-repository memory."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
# The engine (models, storage, the Cartographer, the local LLM backend)
# needs only the core dependencies above and talks to Ollama over stdlib
# urllib — no paid service, no extra install. Everything below is
# application-layer, opt-in, the "GitHub" of this project rather than the
# "git": see docs/architecture.md, "Engine vs. Application".
github = ["PyGithub>=2.3"]
claude = ["claude-agent-sdk>=0.2"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0"]
all = ["atlas-map[github,claude,mcp,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
