name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # dev + mcp + github: the MCP server tests run in-process (no live
      # transport, no live model). The GitHub adapter tests (CODEOWNERS
      # routing, PR formatting) use PyGithub's own exception/mock types
      # but never call the real API or need a token -- github is needed
      # here to construct those types, not to reach github.com. claude
      # stays uninstalled: nothing in the suite needs a live model.
      - run: pip install -e ".[dev,mcp,github]"
      - run: pytest tests/ -v
